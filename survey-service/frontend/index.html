<!DOCTYPE html>
<html>
<head>
  <title>Complaint Survey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Community Civic Portal</h1>
  <h2>Complaint Survey</h2>

  <form id="surveyForm">
    <label>Complaint ID</label>
    <input type="number" id="complaintId" required>

    <label>Is your problem actually solved?</label>
    <select id="actuallySolved">
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label>Are you aware of the Gruha Jyothi / Gruha Lakshmi electricity scheme?</label>
    <select id="awareOfScheme">
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label>Satisfaction Rating (1-5)</label>
    <input type="number" id="rating" min="1" max="5" required>

    <label>Comments</label>
    <textarea id="comments"></textarea>

    <button type="submit">Submit Survey</button>
  </form>

  <div id="result"></div>
</div>
<script src="script.js"></script>
</body>
</html>
